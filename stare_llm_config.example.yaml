backends:
  qwen:
    default_model: "Qwen/Qwen2.5-72B-Instruct"
    max_new_tokens: 512
    temperature: 0.0
    quantization: "gptq"
    tensor_parallel_size: 8
  llama:
    default_model: "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"
    quantization: "awq"
    tensor_parallel_size: 8
    max_model_len: 4096       # 可再降以節省顯存
    max_new_tokens: 256       # 先保守
    temperature: 0.2
    gpu_memory_utilization: 0.45  # 如果仍不足，可降到 0.35~0.4
    dtype: null               # 讓 vLLM 自動選
